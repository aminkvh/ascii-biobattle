name: Release

# Triggers whenever you push a tag like v1.0.0 or v0.3.1
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build all platforms & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o dist/screensaver_linux_amd64 .

      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o dist/screensaver_linux_arm64 .

      - name: Build macOS Intel (amd64)
        run: GOOS=darwin GOARCH=amd64 go build -o dist/screensaver_mac_amd64 .

      - name: Build macOS Apple Silicon (arm64)
        run: GOOS=darwin GOARCH=arm64 go build -o dist/screensaver_mac_arm64 .

      - name: Build Windows amd64 (.exe)
        run: GOOS=windows GOARCH=amd64 go build -o dist/screensaver_windows_amd64.exe .

      - name: Build Windows amd64 (.scr screensaver)
        run: GOOS=windows GOARCH=amd64 go build -o dist/screensaver_amd64.scr .

      - name: Build Windows arm64 (.scr screensaver)
        run: GOOS=windows GOARCH=arm64 go build -o dist/screensaver_arm64.scr .

      - name: Create GitHub Release with all binaries
        uses: softprops/action-gh-release@v2
        with:
          name: "ASCII Battle Screensaver ${{ github.ref_name }}"
          body: |
            ## ASCII Battle Screensaver ${{ github.ref_name }}

            A cross-platform terminal screensaver: medieval knights vs AI robots on a procedural battlefield with a starry night sky, animated water, and occasional bio flashes.

            ### Downloads

            | Platform | File |
            |---|---|
            | Linux x86-64 | `screensaver_linux_amd64` |
            | Linux ARM64 | `screensaver_linux_arm64` |
            | macOS Intel | `screensaver_mac_amd64` |
            | macOS Apple Silicon | `screensaver_mac_arm64` |
            | Windows x86-64 (exe) | `screensaver_windows_amd64.exe` |
            | Windows x86-64 (screensaver) | `screensaver_amd64.scr` |
            | Windows ARM64 (screensaver) | `screensaver_arm64.scr` |

            ### Quick Start
            ```bash
            # Linux / macOS
            chmod +x screensaver_linux_amd64
            ./screensaver_linux_amd64

            # With options
            ./screensaver_linux_amd64 --density 5 --theme night --speed 30
            ```

            See [README.md](README.md) for full setup instructions per platform.
          files: |
            dist/screensaver_linux_amd64
            dist/screensaver_linux_arm64
            dist/screensaver_mac_amd64
            dist/screensaver_mac_arm64
            dist/screensaver_windows_amd64.exe
            dist/screensaver_amd64.scr
            dist/screensaver_arm64.scr
          draft: false
          prerelease: false
