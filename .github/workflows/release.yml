name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: ascii-biobattle_linux_amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            name: ascii-biobattle_linux_arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: ascii-biobattle_mac_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: ascii-biobattle_mac_arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: ascii-biobattle_windows_amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev pkg-config

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -o dist/${{ matrix.name }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  build_windows_scr:
    name: Build Windows Screensaver (.scr)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Build AMD64 SCR
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -o dist/ascii-biobattle_amd64.scr .
      
      - name: Build ARM64 SCR
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 1
        run: go build -o dist/ascii-biobattle_arm64.scr .

      - name: Upload Artifact AMD64
        uses: actions/upload-artifact@v4
        with:
          name: ascii-biobattle_amd64.scr
          path: dist/ascii-biobattle_amd64.scr

      - name: Upload Artifact ARM64
        uses: actions/upload-artifact@v4
        with:
          name: ascii-biobattle_arm64.scr
          path: dist/ascii-biobattle_arm64.scr

  release:
    name: Create GitHub Release
    needs: [build, build_windows_scr]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ASCII Biobattle ${{ github.ref_name }}"
          body: |
            ## ASCII Biobattle ${{ github.ref_name }} (Native Ebitengine GUI)

            A cross-platform native graphical screensaver: medieval knights vs AI robots on a procedural battlefield.

            ### Downloads

            | Platform | File |
            |---|---|
            | Linux x86-64 | `ascii-biobattle_linux_amd64` |
            | Linux ARM64 | `ascii-biobattle_linux_arm64` |
            | macOS Intel | `ascii-biobattle_mac_amd64` |
            | macOS Apple Silicon | `ascii-biobattle_mac_arm64` |
            | Windows x86-64 (exe) | `ascii-biobattle_windows_amd64.exe` |
            | Windows x86-64 (screensaver) | `ascii-biobattle_amd64.scr` |
            | Windows ARM64 (screensaver) | `ascii-biobattle_arm64.scr` |

            See the README.md for installation instructions per OS.
          files: dist/*
          draft: false
          prerelease: false
